<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d4a41">
<title>Τράπεζα Καλών Πρακτικών</title>
<style>
  /* ΑΛΛΑΞΤΕ ΜΟΝΟ τη διεύθυνση APP_URL πιο κάτω, στο <script>. */
  html, body { margin: 0; height: 100%; background: #f2f5f3; font-family: "Segoe UI", system-ui, sans-serif; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
         padding: 6px 16px; background: #1d4a41; color: #eef6f2; font-size: 14px; }
  .bar a { color: #e2ad25; }
  iframe { display: block; width: 100%; height: calc(100% - 34px); border: 0; }
  .msg { max-width: 560px; margin: 60px auto; padding: 0 20px; color: #18231f; line-height: 1.6; }
</style>
</head>
<body>
  <div class="bar">
    <span><a href="../">← Αρχική σελίδα</a></span>
    <span>Δεν φορτώνει; <a id="direct" href="#" target="_blank" rel="noopener">Άνοιγμα σε νέα καρτέλα</a></span>
  </div>
  <iframe id="app" title="Τράπεζα Καλών Πρακτικών" allow="clipboard-write"></iframe>

<script>
  // Επικολλήστε εδώ τη διεύθυνση της εφαρμογής ιστού από το Apps Script (τελειώνει σε /exec)
  const APP_URL = "https://script.google.com/macros/s/AKfycby5B_XNB6nB5Y9AmWFh5vPsQgtg11KDUEycM0Tezqlf400l17e-eo_PDl2JOlNij3Rl/exec";

  const ok = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(APP_URL.trim());
  if (ok) {
    document.getElementById("app").src = APP_URL.trim();
    document.getElementById("direct").href = APP_URL.trim();
  } else {
    document.getElementById("app").remove();
    document.body.insertAdjacentHTML("beforeend",
      '<div class="msg"><h2>Η σελίδα δεν έχει ρυθμιστεί ακόμη</h2>' +
      '<p>Στο αρχείο <code>kales-praktikes/index.html</code> συμπληρώστε τη διεύθυνση της εφαρμογής ' +
      '(<code>https://script.google.com/macros/s/…/exec</code>) στη γραμμή <code>APP_URL</code>.</p></div>');
  }
</script>
</body>
</html>
