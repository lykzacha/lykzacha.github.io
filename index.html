b-app-title" content="Διδακτικές ώρες"><title>Διαχείριση Διδακτικών Ωρών · Έκδοση 1.7.5 · 2026–2027</title><style>
:root {
  color: #203047;
  background: #f3f6fa;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
header {
  background: #153657;
  color: white;
  padding: 19px max(20px, calc((100vw - 1180px) / 2));
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
header strong {
  font-size: 21px;
}
header small {
  display: block;
  color: #c9d8e6;
  margin-top: 3px;
}
main {
  max-width: 1180px;
  padding: 0 16px;
}
nav {
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 20px;
}
button {
  cursor: pointer;
  border: 1px solid #c7d3e1;
  border-radius: 9px;
  background: #fff;
  padding: 10px 13px;
  color: #153657;
  font-weight: 600;
}
button:hover {
  background: #edf4fc;
}
button.primary,
nav button.active {
  background: #1760a5;
  color: white;
  border-color: #1760a5;
}
button.danger {
  color: #a62735;
  border-color: #e5b7bb;
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.panel {
  background: white;
  border: 1px solid #e0e6ed;
  border-radius: 15px;
  padding: 21px;
  margin: 0 0 17px;
  box-shadow: 0 3px 14px #1e3e5910;
}
h2 {
  margin: 0 0 8px;
  font-size: 21px;
}
h3 {
  margin: 16px 0 9px;
  font-size: 16px;
}
.muted {
  color: #64748b;
  font-size: 13px;
  line-height: 1.55;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
}
.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 13px;
  font-weight: 600;
  margin: 7px 0;
}
input,
select,
textarea {
  border: 1px solid #c8d2df;
  border-radius: 8px;
  padding: 10px;
  font: inherit;
  width: 100%;
  background: white;
  color: #1f3047;
}
textarea {
  min-height: 75px;
}
input[type="checkbox"] {
  width: auto;
}
.row {
  display: flex;
  gap: 9px;
  align-items: center;
  flex-wrap: wrap;
}
.row.end {
  justify-content: flex-end;
}
.card {
  border: 1px solid #e1e7ed;
  border-radius: 10px;
  padding: 12px;
  margin: 8px 0;
}
.pill {
  display: inline-block;
  border-radius: 99px;
  padding: 4px 9px;
  background: #eaf2fa;
  color: #155a94;
  font-size: 12px;
  margin: 3px;
}
.notice {
  padding: 12px;
  background: #fef8e7;
  border: 1px solid #f1dc9e;
  border-radius: 9px;
  margin: 12px 0;
}
.success {
  background: #eaf7ee;
  border-color: #a7dfb9;
}
.scroll {
  overflow: auto;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}
th,
td {
  border-bottom: 1px solid #e5e9ee;
  text-align: left;
  padding: 9px 7px;
  vertical-align: top;
}
th {
  background: #f3f7fc;
}
td button {
  padding: 5px 8px;
  font-size: 12px;
}
.checks {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
  gap: 6px;
}
.checks label {
  border: 1px solid #dce4ee;
  border-radius: 8px;
  font-size: 13px;
}
.hours {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.hours label {
  border: 1px solid #d2dfeb;
  padding: 9px;
  border-radius: 8px;
}
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
  gap: 10px;
}
.kpi {
  background: #f3f7fc;
  padding: 15px;
  border-radius: 11px;
}
.kpi b {
  display: block;
  font-size: 24px;
  margin: 5px 0;
}
footer {
  text-align: center;
  color: #708093;
  font-size: 12px;
  margin: 30px;
}
@media (max-width: 600px) {
  header strong {
    font-size: 17px;
  }
  .panel {
    padding: 14px;
  }
}
.gr-date-wrap {
  display: inline-flex;
  position: relative;
  vertical-align: middle;
  max-width: 100%;
}
.gr-date-native {
  position: absolute !important;
  opacity: 0 !important;
  width: 1px !important;
  height: 1px !important;
  pointer-events: none !important;
}
.gr-date-button {
  border: 1px solid #b6c5d5;
  background: #fff;
  color: #203047;
  border-radius: 7px;
  padding: 9px 11px;
  min-width: 145px;
  text-align: left;
  cursor: pointer;
  font: inherit;
}
.gr-date-popup {
  position: absolute;
  top: calc(100% + 5px);
  left: 0;
  z-index: 10000;
  background: #fff;
  border: 1px solid #b6c5d5;
  border-radius: 10px;
  padding: 12px;
  box-shadow: 0 8px 28px #20304733;
  width: 294px;
  max-width: calc(100vw - 35px);
}
.gr-date-head {
  display: flex;
  justify-content: space-between;
  gap: 5px;
  margin-bottom: 8px;
}
.gr-date-head button,
.gr-date-grid button,
.gr-date-footer button {
  border: 1px solid #d8e1ec;
  background: #fff;
  border-radius: 5px;
  padding: 6px;
  cursor: pointer;
  color: #203047;
}
.gr-date-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 3px;
}
.gr-date-grid span {
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  padding: 5px 0;
}
.gr-date-grid button {
  font-size: 12px;
  min-width: 0;
  padding: 7px 0;
}
.gr-date-grid button[aria-pressed="true"] {
  background: #153657;
  color: #fff;
}
.gr-date-grid button:disabled {
  opacity: 0.25;
  cursor: default;
}

  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 6px;
}
.mk-hour {
  display: grid;
  grid-template-columns: auto auto 1fr;
  align-items: center;
  column-gap: 6px;
  row-gap: 1px;
  border: 1px solid #d2dfeb;
  border-radius: 8px;
  padding: 7px 9px;
  font-size: 12px;
  background: #fff;
  cursor: pointer;
  line-height: 1.3;
}
.mk-hour input {
  margin: 0;
}
.mk-hour span {
  overflow-wrap: anywhere;
}
.mk-hour small {
  grid-column: 2/4;
  color: #7a6a5e;
  font-size: 11px;
}
.mk-hour.extra span {
  color: #5d716c;
  font-style: italic;
}
.mk-hour.cover small {
  color: #a6542f;
}
.mk-hour.same small {
  color: #2f6b4f;
}
.mk-hour.disabled {
  opacity: 0.55;
  cursor: not-allowed;
  background: #f4f6f5;
}
.mk-hour:has(input:checked) {
  background: #e5f2eb;
  border-color: #7ab69d;
}
.balance-table td,
.swap-list td {
  white-space: normal;
}
.balance-table td.num {
  text-align: center;
  white-space: nowrap;
  width: 1%;
}
.balance-table th:not(:first-child) {
  text-align: center;
}
.balance-table td.neg strong {
  color: #9a4a2a;
}
.swap-list td:nth-child(-n + 3) {
  white-space: nowrap;
}
.swap-list td:nth-child(4) {
  min-width: 180px;
}
@media (max-width: 650px) {
  .mk-hours {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
.owner-line {
  font-size: 12px;
  color: #4d6b8a;
  margin-top: 2px;
}
.account-form {
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  align-items: end;
  margin-top: 10px;
}
.accounts-table td {
  vertical-align: middle;
}
.my-code {
  margin-top: 8px;
}
.my-code summary {
  cursor: pointer;
  font-size: 13px;
}
.my-code .row {
  margin-top: 6px;
}
.my-code input {
  min-width: 220px;
}
.login-form p {
  margin: 0;
}
.cloud-log {
  margin-top: 18px;
}
.cloud-log summary {
  cursor: pointer;
  font-size: 13px;
  color: #4d6b8a;
}
.cloud-log-table td {
  white-space: nowrap;
}
.cloud-log-table tr.bad td {
  color: #9a4a2a;
}
.mk-recent td:last-child {
  width: 1%;
  white-space: nowrap;
}
.mk-recent td:nth-child(2)::before {
  content: none !important;
}
.login-panel .install-help {
  margin-top: 16px;
}
#cloudStatus:not(.hidden) {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.cs-user {
  font-weight: 700;
  padding-right: 6px;
  border-right: 1px solid currentColor;
}
@media (max-width: 650px) {
  .cs-name {
    display: none;
  }
  .cs-user {
    padding-right: 4px;
  }
}
.acct-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 16px;
}
.acct-actions {
  margin-top: 6px;
}
.login-about {
  margin: 4px 0 8px;
  font-size: 15px;
  color: #174e48;
}
.help-intro {
  background: #f4f8f6;
  border: 1px solid #d7e6df;
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 6px;
}
.help-intro p {
  margin: 6px 0;
}
.help-item {
  border: 1px solid #dfe8e3;
  border-radius: 10px;
  margin: 8px 0;
  background: #fff;
}
.help-item summary {
  cursor: pointer;
  padding: 12px 14px;
  font-weight: 700;
  font-size: 15px;
  color: #174e48;
  list-style-position: inside;
}
.help-item[open] summary {
  border-bottom: 1px solid #e6ece7;
}
.help-body {
  padding: 4px 14px 8px;
}
.help-body p {
  margin: 8px 0;
}
.help-pdf {
  display: inline-block;
  margin-top: 2px;
  padding: 8px 12px;
  border: 1px solid #9cc5b3;
  border-radius: 8px;
  background: #fff;
  color: #174e48;
  font-weight: 700;
  text-decoration: none;
}
.help-hint {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
}
.login-install {
  border: 1px solid #9cc5b3;
  background: #eef7f2;
  border-radius: 10px;
  padding: 10px 14px;
  margin: 10px 0 12px;
}
.login-install ol {
  margin: 6px 0;
  padding-left: 20px;
}
.login-install li {
  margin: 4px 0;
}
.login-install p {
  margin: 4px 0 0;
}
.install-steps {
  margin: 6px 0;
  padding-left: 20px;
}
.install-steps li {
  margin: 4px 0;
}
@media (max-width: 650px) {
  .balance-table td.pos .extra-word {
    display: block;
    font-size: 11px;
    font-weight: 600;
  }
}
.app-layer {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #eef2f1;
  display: flex;
  flex-direction: column;
}
.layer-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 14px;
  padding-top: max(10px, env(safe-area-inset-top));
  background: #174e48;
  color: #fff;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
}
.layer-bar button {
  min-height: 38px;
}
.layer-back {
  background: #fff !important;
  color: #174e48 !important;
  font-weight: 700;
  border-color: #fff !important;
}
.layer-title {
  flex: 1;
  min-width: 120px;
  font-size: 15px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.layer-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  flex: 1 1 0;
  min-width: 0;
}
.layer-actions .primary {
  background: #fff;
  color: #174e48;
  border-color: #fff;
}
.layer-check {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #fff;
}
.layer-body {
  flex: 1;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  min-height: 0;
}
.layer-page {
  background: #fff;
  margin: 14px auto;
  max-width: 1060px;
  padding: 18px;
  border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
}
.guide-layer .layer-body {
  overflow: hidden;
  display: flex;
}
.layer-frame {
  flex: 1;
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  background: #fff;
}
body.layer-open {
  overflow: hidden;
}
@media (max-width: 650px) {
  .layer-bar {
    padding: 8px 10px;
    align-items: flex-start;
  }
  .layer-title {
    order: 3;
    flex-basis: 100%;
    font-size: 14px;
  }
  .layer-actions {
    flex: 1 1 0;
  }
  .layer-page {
    margin: 0;
    border-radius: 0;
    padding: 12px;
  }
}
@media print {
  body.layer-open {
    overflow: visible !important;
    background: #fff !important;
  }
  body.layer-open > *:not(#appLayer) {
    display: none !important;
  }
  .app-layer {
    position: static !important;
    display: block !important;
    background: #fff !important;
  }
  .layer-bar {
    display: none !important;
  }
  .layer-body {
    overflow: visible !important;
    display: block !important;
  }
  .layer-page {
    margin: 0 !important;
    padding: 0 !important;
    max-width: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
  }
}
/* 1.7.5: ώρες δίπλα στο μάθημα (καταγραφή μίας ημέρας) και «Έγινε άλλη ώρα» */
.lc-list {
  display: grid;
  gap: 6px;
}
/* οι ώρες δίπλα στο όνομα· σε στενή οθόνη κατεβαίνουν από κάτω, χωρίς να πέφτουν πάνω στο όνομα */
.lc-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 10px;
  padding: 7px 9px;
  border: 1px solid #dfe8e2;
  border-radius: 8px;
  background: #fbfcfb;
}
.lc-row.has-hours {
  background: #f1f8f4;
  border-color: #9fcbb6;
}
.lc-course {
  flex: 1 1 100px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  line-height: 1.3;
  cursor: pointer;
}
.lc-course input {
  margin: 0;
  flex-shrink: 0;
}
.lc-course span {
  overflow-wrap: anywhere;
}
.lc-hours {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 5px;
  margin-left: auto;
}
.lc-hour {
  position: relative;
  display: inline-flex;
  cursor: pointer;
}
.lc-hour input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
.lc-hour span {
  min-width: 42px;
  padding: 6px 9px;
  border: 1px solid #c9d8cf;
  border-radius: 999px;
  background: #fff;
  color: #4f625b;
  font-size: 12px;
  font-weight: 650;
  text-align: center;
}
.lc-hour input:checked + span {
  background: #195b50;
  border-color: #195b50;
  color: #fff;
}
.lc-hour input:focus-visible + span {
  outline: 3px solid #8fc4b2;
  outline-offset: 2px;
}
.lc-row .lc-move-btn {
  flex-basis: 100%;
  text-align: left;
  margin-top: 2px;
  padding: 2px 0;
  border: 0;
  background: none;
  color: #2b6a84;
  font-size: 11.5px;
  font-weight: 550;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.lc-row .lc-move-btn:hover {
  background: none;
  color: #1d4f63;
}
.lc-moves {
  flex-basis: 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  padding-top: 4px;
}
.lc-row:not(.has-hours) .lc-move-btn,
.lc-row:not(.has-hours) .lc-moves,
.lc-row:not(.move-open) .lc-moves {
  display: none;
}
.lc-move {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #4f625b;
}
.lc-move.hidden {
  display: none;
}
.lc-move span {
  white-space: nowrap;
}
.lc-move select {
  width: auto;
  padding: 4px 8px;
  font-size: 12px;
}

function weeklyJointSessions(pid, slots = data.slots) {
  const sessions = new Map();
  for (const s of slots.filter(s => s.periodId === pid && s.joint)) {
    const key = s.day + '|' + s.hour + '|' + s.joint;
    if (!sessions.has(key)) sessions.set(key, { day: s.day, hour: s.hour, joint: s.joint, slots: [] });
    sessions.get(key).slots.push(s);
  }
  return [...sessions.values()]
    .map(x => {
      const j = data.joints.find(j => j.id === x.joint),
        present = new Set(x.slots.map(s => s.groupId)),
        missing = (j?.groupIds || []).filter(id => !present.has(id)),

function weeklySchedule(pid, gid, slots = data.slots) {
  let group = data.groups.find(g => g.id === gid);
  if (!group) return '';
  let isGeneral = group.category === CATS[0];
  let parallel = data.groups.filter(
    g => g.id !== gid && g.grade === group.grade && g.category !== CATS[0] && g.category !== CATS[1]
  );
  // Στη Γ, τα τμήματα ΓΠ βάσει Προσανατολισμού αποτελούν επίσης παράλληλη διδασκαλία.
  if (group.grade === GRADES[2])
    parallel = data.groups.filter(g => g.id !== gid && g.grade === group.grade && g.category !== CATS[0]);
  let slotAt = (id, day, h) => slots.find(s => s.periodId === pid && s.groupId === id && s.day === day && s.hour === h);
  let cell = (day, h) => {
    let own = slotAt(gid, day, h);
    let others = isGeneral ? parallel.map(g => ({ g, sl: slotAt(g.id, day, h) })).filter(x => x.sl) : [];
    // Εμφάνιση όλων των παράλληλων μαθημάτων, χωρίς επανάληψη της ίδιας συνδιδασκαλίας.
    let unique = new Map();
    for (let x of others) {
      let k = x.sl.joint ? 'j:' + x.sl.joint : 'g:' + x.g.id;
      let item = unique.get(k);
      if (item) item.names.push(x.g.name);
      else unique.set(k, { sl: x.sl, names: [x.g.name] });
    }
    let extra = [...unique.values()];
    if (!own && !extra.length) return '—';
    let html = own
      ? `<div><b>${esc(sname(own.subjectId, own.groupId))}</b>${own.joint ? `<div class="muted">Κοινή: ${esc(data.joints.find(j => j.id === own.joint)?.name || own.joint)}</div>` : ''}</div>`

function statDays(from, to) {
  let out = [];
  if (!from || !to || from > to) return out;
  let d = new Date(from + 'T12:00:00'),
    end = new Date(to + 'T12:00:00');
  for (let n = 0; d <= end && n < 550; n++, d.setDate(d.getDate() + 1)) {
    let iso =
      d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    if (

        .reduce(

    date: plan.from,
    rangeTo: plan.to,
    name: 'Εκτός ωρολογίου · Σύνολο διαστήματος',
    count,
    duplicates: plan.duplicates

    snapshots = fresh.flatMap(r =>

        r.groupIds.map(groupId => ({
          id: uid(),
          periodId: null,

    ...e,

    scheduleName: 'Χωρίς πρόγραμμα',
    manualRangeTotal: true,
    manualRangeDays: [...plan.days],

function validateManualRangeTotal(e) {

    !Array.isArray(e.manualEntries) ||
    !e.manualEntries.length ||
    new Set(e.manualEntries.map(r => r?.id)).size !== e.manualEntries.length ||
    !Array.isArray(e.slotSnapshots) ||
    e.slotSnapshots.length !==
      e.manualEntries.reduce((n, r) => n + (Number(r?.count) || 0) * (r?.groupIds?.length || 0), 0) ||

function validateEventSchema(d) {
  const validId = x => typeof x === 'string' && /^[A-Za-z0-9_-]{1,100}$/.test(x);
  for (const key of ['groups', 'subjects', 'periods', 'slots', 'events', 'joints'])
    if (d[key] && (!Array.isArray(d[key]) || d[key].some(x => !x || !validId(x.id))))
      throw Error('Μη συμβατές εγγραφές: ' + key);
  const validNames = o =>
    o === undefined ||
    (o &&
      typeof o === 'object' &&
      !Array.isArray(o) &&
      Object.entries(o).every(([id, name]) => validId(id) && typeof name === 'string' && name.length <= 500));
  if (
    d.groups.some(g => !validNames(g.subjectNames)) ||
    (d.subjectNamesBySource !== undefined &&
      (!d.subjectNamesBySource ||
        typeof d.subjectNamesBySource !== 'object' ||
        Array.isArray(d.subjectNamesBySource) ||
        Object.entries(d.subjectNamesBySource).some(
          ([source, names]) => !Object.hasOwn(SOURCE_LABELS, source) || !validNames(names)
        )))
  )
    throw Error('Μη συμβατές ονομασίες μαθημάτων.');
  if (
    typeof d.school !== 'string' ||
    typeof d.year !== 'string' ||
    d.groups.some(g => !GRADES.includes(normalizeGrade(g.grade)) || !Array.isArray(g.subjectIds)) ||
    d.events.some(e => !Array.isArray(e.hours) || !Array.isArray(e.groupIds) || !Array.isArray(e.slotSnapshots))
  )
    throw Error('Το αντίγραφο δεν περιέχει τη σωστή δομή της εφαρμογής.');
  if (d.calendar) {
    if (
      typeof d.calendar !== 'object' ||
      !Array.isArray(d.calendar.exclusions || []) ||
      ['start', 'end'].some(k => d.calendar[k] && !validISODate(d.calendar[k]))
    )
      throw Error('Μη συμβατό σχολικό ημερολόγιο.');
    for (const e of d.calendar.exclusions || []) {
      if (!e || typeof e.reason !== 'string' || (e.id && !validId(e.id)))
        throw Error('Μη συμβατή εξαίρεση ημερολογίου.');
      const b = exclusionBounds(e);
      if (!validISODate(b.from) || !validISODate(b.to) || b.from > b.to) throw Error('Μη έγκυρη περίοδος εξαίρεσης.');
    }
  }
  for (const e of d.events) {
    validateManualRangeTotal(e);
    const manualLimit = e.manualRangeTotal ? 7 * e.manualRangeDays.length : 7;
    if (e.updatedAt !== undefined && (typeof e.updatedAt !== 'string' || Number.isNaN(Date.parse(e.updatedAt))))
      throw Error('Μη συμβατή ημερομηνία τροποποίησης.');
    if (e.batchId !== undefined && !validId(e.batchId)) throw Error('Μη συμβατή ομαδική καταγραφή.');
    if (
      (e.rangeFrom !== undefined && !validISODate(e.rangeFrom)) ||
      (e.rangeTo !== undefined && !validISODate(e.rangeTo)) ||
      (e.rangeFrom && e.rangeTo && e.rangeFrom > e.rangeTo)
    )
      throw Error('Μη συμβατό διάστημα καταγραφής.');
    if (e.scheduleMode !== undefined && !['auto', 'selected', 'manual'].includes(e.scheduleMode))
      throw Error('Μη συμβατός τρόπος καταγραφής.');
    if (e.schedulePeriodId !== undefined && !validId(e.schedulePeriodId))
      throw Error('Μη συμβατό πρόγραμμα καταγραφής.');
    if (e.scheduleName !== undefined && typeof e.scheduleName !== 'string')
      throw Error('Μη συμβατή ονομασία προγράμματος.');
    if (
      e.slotSnapshots.some(
        s =>
          s?.movedHour !== undefined &&
          (!Number.isInteger(s.movedHour) || s.movedHour < 1 || s.movedHour > 7 || s.movedHour === s.hour)
      )
    )
      throw Error('Μη συμβατή ώρα πραγματοποίησης.');
    if (
      e.dayProgramSnapshots !== undefined &&
      (!Array.isArray(e.dayProgramSnapshots) ||
        !Array.isArray(e.programGroupIds) ||
        e.programGroupIds.some(id => !validId(id)) ||
        e.dayProgramSnapshots.some(
          s =>
            !s || !validId(s.groupId) || !validId(s.subjectId) || !Number.isInteger(s.hour) || s.hour < 1 || s.hour > 7
        ))
    )
      throw Error('Μη συμβατό πρόγραμμα ημέρας.');
    if (
      e.scheduleMode === 'manual' &&
      (!Array.isArray(e.manualEntries) ||
        e.manualEntries.some(
          r =>
            !r ||
            !validId(r.id) ||
            !Array.isArray(r.groupIds) ||
            !r.groupIds.length ||
            r.groupIds.some(id => !validId(id)) ||
            !validId(r.subjectId) ||
            !Number.isInteger(r.count) ||
            r.count < 1 ||
            r.count > manualLimit
        ) ||
        e.slotSnapshots.some(
          s =>
            !s?.manual ||
            s.manualEventId !== e.id ||
            !validId(s.manualEntryId) ||
            !Number.isInteger(s.unitIndex) ||
            s.unitIndex < 0 ||
            s.unitIndex >= manualLimit ||
            !validId(s.groupId) ||
            !validId(s.subjectId)
        ))
    )
      throw Error('Μη συμβατή καταγραφή εκτός ωρολογίου.');
  }
}

// CSS γραμμένο για ξεχωριστή σελίδα → μόνο για το περιεχόμενο της προβολής (html/body = η ίδια η σελίδα της προβολής)
function scopeCSS(css, scope) {
  const st = document.createElement('style');
  st.media = 'not all';
  st.textContent = css;
  document.head.appendChild(st);
  const one = s => {
      s = s.trim();
      if (!s) return '';
      if (/^(html|body)\b/.test(s)) return s.replace(/^(html|body)\b/, scope);
      return scope + ' ' + s;
    },
    // κανόνες: 1 = στυλ, 4 = @media (αναδρομικά), 6 = @page (παραλείπεται· η προβολή ορίζει τη δική της σελίδα)
    walk = rules =>
      [...rules]
        .map(r =>
          r.type === 1
            ? r.selectorText.split(',').map(one).filter(Boolean).join(',') + '{' + r.style.cssText + '}'
            : r.type === 4
              ? '@media ' + r.media.mediaText + '{' + walk(r.cssRules) + '}'
              : r.type === 6
                ? ''
                : r.cssText
        )
        .join('\n');
  let out = '';
  try {
    out = walk(st.sheet?.cssRules || []);
  } finally {
    st.remove();
  }
  return out;
}

  if (cloudDevice() === 'ios' && navigator.canShare && typeof File === 'function') {
    try {
      const file = new File([blob], name, { type: blob.type || 'application/octet-stream' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });

    } catch (e) {

  const a = document.createElement('a'),

  a.click();
  a.remove();

    .map(

    .map(s => {
      const k = slotKeyOf(s);
      return `<label class="lc-move${logSlotChecked(k) ? '' : ' hidden'}" data-for="${esc(k)}"><span>${s.hour}η → έγινε</span><select data-lmv="${esc(k)}" onchange="logMoveChange(this)"><option value="">στην ώρα του</option>${[

}
function logSlotChoicesHTML() {

  return `<div class="log-course-groups log-slot-groups" id="logSlotChoices">${groups
    .map(gid => {

      }
      const list = [...rows.values()].map(r => ({ ...r, name: [...r.names].join(' / ') })),

      return `<div class="log-course-group"><div class="log-course-head"><strong>${esc(name)}</strong>${list.length ? `<span class="row"><button type="button" onclick="toggleGroupCourses('${gid}',true)">Όλα</button><button type="button" onclick="toggleGroupCourses('${gid}',false)">Κανένα</button></span>` : ''}</div>${list.length ? `<div class="lc-list">${list.map(logSlotRowHTML).join('')}</div>` : '<p class="muted">Δεν έχει μαθήματα στο πρόγραμμα αυτής της ημέρας.</p>'}</div>`;

function logRowSync(row) {

}

function captureLogCourses() {
  if ($('logSlotChoices')) {
    logSlotKeys = [...document.querySelectorAll('[data-lsh]:checked')].map(x => x.dataset.lsh);
    logSubjectIds = [...new Set(logSlotKeys.map(k => k.split('|').slice(0, 2).join('|')))];
    logMoved = {};
    document.querySelectorAll('[data-lmv]').forEach(x => {
      if (Number(x.value)) logMoved[x.dataset.lmv] = Number(x.value);
    });
    logMoveOpen = [...document.querySelectorAll('.lc-row.move-open')].map(x => x.dataset.row);
    return;
  }
  logSubjectIds = [...document.querySelectorAll('[data-ls]:checked')].map(x => x.dataset.ls);
  // εκτός των ωρών ανά μάθημα (διάστημα, όλα τα μαθήματα), η επιλογή ξαναβγαίνει από μαθήματα × ώρες
  if (!$('logSlotStep')) logSlotKeys = null;
}
// επιλογή από τις ώρες δίπλα στα μαθήματα (ίδια μορφή με currentSelection, και οι ώρες ως «τμήμα|μάθημα|ώρα»)
function slotSelection() {
  const groupIds = [...document.querySelectorAll('[data-lg]:checked')].map(x => x.dataset.lg),
    slotKeys = (logSlotKeys || []).filter(k => groupIds.includes(k.split('|')[0])),
    moved = {};
  for (const k of slotKeys) {
    const h = logMoved[k];
    if (Number.isInteger(h) && h >= 1 && h <= 7 && h !== Number(k.split('|')[2])) moved[k] = h;
  }
  return {
    date: $('ld').value,
    groupIds,
    hours: [...new Set(slotKeys.map(k => Number(k.split('|')[2])))].sort((a, b) => a - b),
    subjectIds: [...new Set(slotKeys.map(k => k.split('|').slice(0, 2).join('|')))],
    slotKeys,
    moved
  };
}
// ώρα που έγινε κάθε ώρα της καταγραφής (0 = στην ώρα της)· η συνδιδασκαλία μετακινείται μαζί σε όλα τα τμήματα
function logMoveOf(sel, slots) {
  if (!sel.moved) return null;
  const joint = new Map();
  for (const s of slots) {
    const m = sel.moved[slotKeyOf(s)];
    if (m && s.joint) joint.set(s.joint + '|' + s.hour, m);
  }
  return s => sel.moved[slotKeyOf(s)] || (s.joint && joint.get(s.joint + '|' + s.hour)) || 0;
}
function withMove(x, moveOf) {
  if (!moveOf) return x;
  delete x.movedHour;
  const m = moveOf(x);
  if (m && m !== x.hour) x.movedHour = m;
  return x;
}
function withoutMove(s) {
  if (!s || s.movedHour === undefined) return s;
  const { movedHour: _m, ...rest } = s;
  return rest;
}
function movedLabel(s) {
  return s?.movedHour ? ' (έγινε ' + s.movedHour + 'η)' : '';
}
// στην προεπισκόπηση: ποιες ώρες έγιναν αλλού και αν την ίδια ώρα υπάρχει ήδη άλλο μάθημα του τμήματος
function logMoveNotes(plan, fresh, existing, moveOf) {
  if (!moveOf) return;
  const same = (a, b) => a.groupId === b.groupId && a.subjectId === b.subjectId && (a.joint || '') === (b.joint || ''),
    seen = new Set();
  for (const s of fresh) {
    const m = moveOf(s);
    if (!m || m === s.hour) continue;
    const id = s.joint ? 'j:' + s.joint + '|' + s.hour : slotKeyOf(s);
    if (!seen.has(id)) {
      seen.add(id);
      (plan.moves = plan.moves || []).push(
        gname(s.groupId) + ' · ' + snapshotCourseName(s) + ' ' + s.hour + 'η → ' + m + 'η'
      );
    }
    const clash = [
      ...existing.flatMap(e =>
        (e.slotSnapshots || [])
          .filter(x => !x.manual && x.groupId === s.groupId && !same(x, s) && (x.movedHour || x.hour) === m)
          .map(x => [x, recordingLabel(e)])
      ),
      ...fresh
        .filter(x => x !== s && x.groupId === s.groupId && !same(x, s) && (moveOf(x) || x.hour) === m)
        .map(x => [x, 'στην ίδια καταγραφή'])
    ];
    if (clash.length)
      plan.warnings.push(
        gname(s.groupId) +
          ' · ' +
          snapshotCourseName(s) +
          ' έγινε ' +
          m +
          'η: την ίδια ώρα υπάρχει ήδη ' +
          [...new Set(clash.map(([x, label]) => snapshotCourseName(x) + ' (' + label + ')'))].join(', ') +
          '. Ελέγξτε ότι η ίδια ώρα δεν μετρά δύο φορές.'
      );
  }
}
function examsPanelHTML(r) {
  const m = new Map(),
    gOrder = id => (i => (i < 0 ? 999 : i))(data.groups.findIndex(g => g.id === id));
  let test = 0,
    term = 0;
  for (const x of r.exams) {
    const key = x.s.groupId + '|' + x.s.subjectId;
    if (!m.has(key))
      m.set(key, {
        gid: x.s.groupId,
        sid: x.s.subjectId,
        group: x.s.groupName || gname(x.s.groupId),
        course: snapshotCourseName(x.s),
        test: 0,
        term: 0,
        termSet: new Set(),
        testSet: new Set()
      });
    const row = m.get(key);
    row[x.exam]++;
    row[x.exam + 'Set'].add(String(x.date));
    if (x.exam === 'test') test++;
    else term++;
  }
  const saved = [statGroup, statSubject],
    rows = [...m.values()].sort((a, b) => gOrder(a.gid) - gOrder(b.gid) || a.course.localeCompare(b.course, 'el'));
  try {
    for (const x of rows) {
      statGroup = x.gid;
      statSubject = x.sid;
      const t = calculateStats();
      x.done = t.planned + t.manualCount - t.lostAll;
    }
  } finally {
    [statGroup, statSubject] = saved;
  }
  const n = c => (c === 1 ? '1 ώρα' : c + ' ώρες');
  return `<p class="muted">Ώρες εξετάσεων: <strong>${test + term}</strong> · Ωριαίες εξετάσεις (τεστ): <strong>${n(test)}</strong> · Διαγωνίσματα τετραμήνου: <strong>${n(term)}</strong>. Οι ώρες εξετάσεων είναι πραγματοποιημένες ώρες και δεν αλλάζουν τις χαμένες.</p>
 <div class="scroll"><table class="exam-table"><thead><tr><th>Τμήμα</th><th>Μάθημα</th><th>Τεστ</th><th>Διαγωνίσματα τετραμήνου</th><th>Ώρες εξετάσεων / πραγματοποιημένες</th></tr></thead><tbody>${rows.map(x => `<tr><td>${esc(x.group)}</td><td>${esc(x.course)}</td><td>${x.test ? x.test + ' τεστ' : '—'}</td><td>${x.term ? x.termSet.size + (x.termSet.size === 1 ? ' διαγώνισμα' : ' διαγωνίσματα') + ' (' + n(x.term) + ')' : '—'}</td><td>${x.test + x.term} από ${x.done} <span class="muted">(${pctText(x.test + x.term, x.done)})</span></td></tr>`).join('')}</tbody></table></div>`;
}
function lostPercent(r) {
  const t = r.planned + r.manualCount;
  return t ? (Math.round((r.lost / t) * 1000) / 10).toLocaleString('el-GR') + '%' : '0%';
}

}
